
apiVersion: v1
kind: Secret
metadata:
  namespace: prow
  name: s3-credentials
stringData:
  service-account.json: |
    {
      "region": "minio",
      "access_key": "$AZURE_STORAGE_ACCOUNT_USER",
      "endpoint": "http://minio.prow.svc.cluster.local",
      "insecure": true,
      "s3_force_path_style": true,
      "secret_key": "$AZURE_STORAGE_ACCOUNT_PASSWORD"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: prow
spec:
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      nodeSelector:
        agentpool: prow
      containers:
      - name: minio
        image: docker.io/scality/s3server:latest
        env:
        - name: SCALITY_ACCESS_KEY_ID
          value: "$AZURE_STORAGE_ACCOUNT_USER"
        - name: SCALITY_SECRET_ACCESS_KEY
          value: "$AZURE_STORAGE_ACCOUNT_PASSWORD"
        ports:
        - containerPort: 8000
        readinessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: prow
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  selector:
    app: minio
---
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: prow
spec:
  type: NodePort
  ports:
  - port: $MINIO_CONSOLE_PORT
    targetPort: 8000
    protocol: TCP
  selector:
    app: minio